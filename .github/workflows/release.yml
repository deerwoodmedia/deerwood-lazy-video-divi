name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin ZIP
        run: |
          mkdir -p build/deerwood-lazy-video-divi
          rsync -av --exclude='.git*' --exclude='build' --exclude='README.md' ./ build/deerwood-lazy-video-divi/
          cd build
          zip -r deerwood-lazy-video-divi.zip deerwood-lazy-video-divi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" build/deerwood-lazy-video-divi.zip --clobber
          else
            gh release create "${{ github.ref_name }}" \
              build/deerwood-lazy-video-divi.zip \
              --title "Deerwood Lazy Video for Divi ${{ github.ref_name }}" \
              --generate-notes
          fi
